name: Build and publish images

# Builds the four service images and pushes them to the GitHub Container
# Registry. Authentication uses the automatic GITHUB_TOKEN, so no secret
# has to be configured.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: database-server
            context: ./database_server
          - name: data-entry-server
            context: ./data_entry_server
          - name: web-server
            context: ./web_server
          - name: frontend-proxy-server
            context: ./frontend_proxy_server

    steps:
      - uses: actions/checkout@v4

      # Image references must be lowercase, the owner name may not be.
      - name: Compute image name
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${REGISTRY}/${OWNER,,}/gs1-resolver-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Separate cache scope per service, otherwise the matrix jobs
          # overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
